name: CI

on: [ push, pull_request ]

jobs:
  build:
    name: Build (Go ${{ matrix.go }}, OS ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: [ stable ]
        os: [ ubuntu-latest, macos-latest ]
    env:
      GO111MODULE: on
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.sum
            tests/go.sum

      - name: Show versions
        run: go version

      - name: Install Go dependencies
        run: go mod download

      - name: Run golang tests
        run: >-
          go test -race -v -count=1 -timeout=5m
          -coverpkg=./semaphore,./shm -coverprofile=coverage.txt -covermode=atomic
          ./... ./tests/...

      - name: Run code coverage
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage.txt
          disable_search: true

  golangci-lint:
    name: Golang-CI (lint, OS ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            tests/go.sum

      - name: Run linter
        uses: golangci/golangci-lint-action@v9 # Action page: <https://github.com/golangci/golangci-lint-action>
        with:
          version: v2.15.0
          only-new-issues: false # show only new issues if it's a pull request
          args: --timeout=10m
